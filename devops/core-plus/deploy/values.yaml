global:
  domain: ""
  limitsEnabled: true

data:
  # configmaps
  logLevel: "ERROR"
  entitlementsHost: "http://entitlements"
  # deployments
  requestsCpu: "5m"
  requestsMemory: "280Mi"
  limitsCpu: "1"
  limitsMemory: "1G"
  serviceAccountName: "crs-catalog"
  image: ""
  imagePullPolicy: "IfNotPresent"

conf:
  appName: "crs-catalog"
  replicas: 1

istio:
  proxyCPU: "5m"
  proxyCPULimit: "200m"
  proxyMemory: "50Mi"
  proxyMemoryLimit: "256Mi"
  auth:
    basePath: /api/crs/catalog
    versions:
      - v2
      - v3
    disable:
      - "/api/crs/catalog/api-docs"
      - "/api/crs/catalog/api-docs/*"
      - "/api/crs/catalog/api-docs.yaml"
      - "/api/crs/catalog/api-docs.yaml/*"
      - "/api/crs/catalog/swagger"
      - "/api/crs/catalog/api-docs/swagger-config"
