seed = 42424242424424242
workers = 1
continue-on-failure = true

[generation]
mode = "all"
max-examples = 20
# Spring MVC ignores undeclared query parameters. Avoid generating those
# mutations while retaining negative-data checks for invalid request bodies.
allow-extra-parameters = false

[phases.stateful]
enabled = false

[phases.examples]
enabled = true

[phases.coverage]
enabled = true

[phases.fuzzing]
enabled = true

[reports.junit]
path = "./output/junit/junit.xml"

[reports.allure]
path = "./output/allure/results"

# Catalog bounds, unsupported modes and malformed persistable references may
# reject generated inputs that satisfy the structural schema. Match Unit, File
# and Storage while keeping positive-data acceptance and server-error checks.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", "400", "401", "403", "404", "409", "429", "5xx"]
